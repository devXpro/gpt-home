<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Home is offline / Дом не на связи</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #0b0b0f;
    color: #f2f2f7;
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 420px; text-align: center; }
  .dot {
    width: 14px;
    height: 14px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: #ff9f0a;
    box-shadow: 0 0 0 6px rgba(255, 159, 10, 0.18);
  }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0 0 28px; color: #98989f; }
  h1 + p + h1 { margin-top: 8px; }
</style>
</head>
<body>
<main>
  <div class="dot" aria-hidden="true"></div>
  <h1>Home is offline</h1>
  <p>The home computer may be asleep or without internet. Try again later.</p>
  <h1>Дом не на связи</h1>
  <p>Домашний компьютер, возможно, спит или без интернета. Попробуйте позже.</p>
</main>
</body>
</html>
