# frps for GPT-Home: a dumb relay behind a TLS-terminating proxy (Caddy).
# Keys confirmed against frp v0.72.0 (pkg/config/v1/server.go).

# One port for everything. frps looks at the first bytes of every connection:
# "GET /~!frp" is the frpc websocket channel from home, any other HTTP request
# is vhost traffic that is routed by the Host header to the connected frpc.
bindPort = 7000
vhostHTTPPort = 7000

# Shared secret, read from a file (trailing whitespace is trimmed).
auth.method = "token"
auth.tokenSource.type = "file"
auth.tokenSource.file.path = "/etc/frp/token"

# Served with status 404 while no frpc is connected (home is offline).
custom404Page = "/etc/frp/offline.html"

log.to = "console"
log.level = "info"
